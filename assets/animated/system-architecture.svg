<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="936" viewBox="0 0 1664 936">
<defs>
  <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
    <path d="M52 0H0V52" fill="none" stroke="#174a35" stroke-width="1.2" opacity=".34"/>
    <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="-52 52" dur="21s" repeatCount="indefinite"/>
  </pattern>
  <radialGradient id="halo"><stop offset="0" stop-color="#30ff8f" stop-opacity=".15"/><stop offset="1" stop-color="#03110b" stop-opacity="0"/></radialGradient>
  <linearGradient id="scan" x1="0" x2="1"><stop stop-color="#48ff99" stop-opacity="0"/><stop offset=".5" stop-color="#48ff99" stop-opacity=".16"/><stop offset="1" stop-color="#48ff99" stop-opacity="0"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<rect width="1664" height="936" rx="22" fill="#07100e"/>
<rect x="34" y="28" width="1596" height="880" rx="24" fill="#04140d" stroke="#1b6848" stroke-width="1.5"/>
<rect x="34" y="28" width="1596" height="880" rx="24" fill="url(#grid)"/>
<rect width="1664" height="936" fill="url(#halo)"><animate attributeName="opacity" values=".5;1;.55;1;.5" dur="11s" repeatCount="indefinite"/></rect>
<rect x="-220" y="30" width="220" height="876" fill="url(#scan)"><animate attributeName="x" values="-220;1664;-220" dur="15s" repeatCount="indefinite"/></rect>

<g stroke="#45ff99" stroke-width="2.3" opacity=".58"><path d="M68 92V50h44"/><path d="M1552 50h44v42"/><path d="M68 844v42h44"/><path d="M1552 886h44v-42"/></g>

<text x="832" y="92" text-anchor="middle" fill="#f1fff6" font-family="Inter,system-ui,sans-serif" font-size="56" font-weight="900">SYSTEM ARCHITECTURE</text>
<text x="832" y="136" text-anchor="middle" fill="#5ce49b" font-family="ui-monospace,monospace" font-size="19" font-weight="800" letter-spacing="5">EXPERIENCE / LOGIC / INTELLIGENCE / DATA / DELIVERY</text>

<!-- top pipeline -->
<g font-family="Inter,system-ui,sans-serif" font-weight="850" text-anchor="middle">
  <g><rect x="628" y="170" width="408" height="58" rx="15" fill="#08281a" stroke="#2e9861" stroke-width="1.6"/><text x="832" y="207" fill="#effff5" font-size="22">USER EXPERIENCE</text><animate attributeName="opacity" values=".72;1;.72" dur="4s" repeatCount="indefinite"/></g>
  <g><rect x="654" y="248" width="356" height="56" rx="15" fill="#08251a" stroke="#257b50"/><text x="832" y="284" fill="#effff5" font-size="21">APPLICATION LOGIC</text><animate attributeName="opacity" values=".72;1;.72" dur="4s" begin=".5s" repeatCount="indefinite"/></g>
  <g><rect x="642" y="324" width="380" height="56" rx="15" fill="#08251a" stroke="#257b50"/><text x="832" y="360" fill="#effff5" font-size="21">INTELLIGENT SYSTEMS</text><animate attributeName="opacity" values=".72;1;.72" dur="4s" begin="1s" repeatCount="indefinite"/></g>
  <g><rect x="676" y="400" width="312" height="56" rx="15" fill="#08251a" stroke="#257b50"/><text x="832" y="436" fill="#effff5" font-size="21">DATA + STORAGE</text><animate attributeName="opacity" values=".72;1;.72" dur="4s" begin="1.5s" repeatCount="indefinite"/></g>
</g>

<g stroke="#54f9a0" stroke-width="2.6" opacity=".72">
  <line x1="832" y1="228" x2="832" y2="248"/><line x1="832" y1="304" x2="832" y2="324"/><line x1="832" y1="380" x2="832" y2="400"/>
</g>
<g fill="#8affba">
  <circle r="6"><animateMotion dur="2.4s" repeatCount="indefinite" path="M832 228V248"/></circle>
  <circle r="6"><animateMotion dur="2.4s" begin=".5s" repeatCount="indefinite" path="M832 304V324"/></circle>
  <circle r="6"><animateMotion dur="2.4s" begin="1s" repeatCount="indefinite" path="M832 380V400"/></circle>
</g>

<!-- architecture bus -->
<line x1="145" y1="500" x2="1519" y2="500" stroke="#31d97f" stroke-width="2.4" stroke-dasharray="9 14" opacity=".55"><animate attributeName="stroke-dashoffset" values="0;-138" dur="8s" repeatCount="indefinite"/></line>
<circle r="7" fill="#a1ffca" filter="url(#blur)"><animateMotion dur="8s" repeatCount="indefinite" path="M145 500H1519"/></circle>
<text x="148" y="485" fill="#4ed58f" font-family="ui-monospace,monospace" font-size="17" font-weight="800">ARCH_BUS / ONLINE</text>
<text x="1516" y="485" text-anchor="end" fill="#4ed58f" font-family="ui-monospace,monospace" font-size="17" font-weight="800">FLOW / SYNCED</text>

<!-- cards -->
<g font-family="Inter,system-ui,sans-serif">
  <g transform="translate(76 535)">
    <rect width="294" height="287" rx="18" fill="#08261a" fill-opacity=".88" stroke="#227c51" stroke-width="1.5"/>
    <rect width="294" height="6" rx="3" fill="#43f493"/>
    <text x="22" y="42" fill="#61f7a1" font-family="ui-monospace,monospace" font-size="17" font-weight="800">01 / EXPERIENCE</text>
    <text x="22" y="88" fill="#effff5" font-size="29" font-weight="900">WEB + UI</text>
    <text x="22" y="120" fill="#80c39f" font-size="19">Product interfaces</text>
    <g fill="#a7d4b9" font-size="19"><text x="22" y="166">React / Next.js</text><text x="22" y="204">TypeScript / Tailwind</text><text x="22" y="242">Responsive interaction</text></g>
    <circle cx="264" cy="42" r="6" fill="#6dffae"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(382 535)">
    <rect width="294" height="287" rx="18" fill="#08261a" fill-opacity=".88" stroke="#227c51" stroke-width="1.5"/>
    <rect width="294" height="6" rx="3" fill="#43f493"/>
    <text x="22" y="42" fill="#61f7a1" font-family="ui-monospace,monospace" font-size="17" font-weight="800">02 / LOGIC</text>
    <text x="22" y="88" fill="#effff5" font-size="29" font-weight="900">APPLICATIONS</text>
    <text x="22" y="120" fill="#80c39f" font-size="19">Services + desktop logic</text>
    <g fill="#a7d4b9" font-size="19"><text x="22" y="166">Node / PHP / Python</text><text x="22" y="204">C# / .NET / Swift</text><text x="22" y="242">APIs + state + tooling</text></g>
    <circle cx="264" cy="42" r="6" fill="#6dffae"><animate attributeName="r" values="4;8;4" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(688 535)">
    <rect width="294" height="287" rx="18" fill="#08261a" fill-opacity=".88" stroke="#227c51" stroke-width="1.5"/>
    <rect width="294" height="6" rx="3" fill="#43f493"/>
    <text x="22" y="42" fill="#61f7a1" font-family="ui-monospace,monospace" font-size="17" font-weight="800">03 / INTELLIGENCE</text>
    <text x="22" y="88" fill="#effff5" font-size="29" font-weight="900">AI PIPELINES</text>
    <text x="22" y="120" fill="#80c39f" font-size="19">Vision + inference</text>
    <g fill="#a7d4b9" font-size="19"><text x="22" y="166">MediaPipe</text><text x="22" y="204">ONNX / TensorFlow.js</text><text x="22" y="242">Browser-side ML</text></g>
    <circle cx="264" cy="42" r="6" fill="#6dffae"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(994 535)">
    <rect width="294" height="287" rx="18" fill="#08261a" fill-opacity=".88" stroke="#227c51" stroke-width="1.5"/>
    <rect width="294" height="6" rx="3" fill="#43f493"/>
    <text x="22" y="42" fill="#61f7a1" font-family="ui-monospace,monospace" font-size="17" font-weight="800">04 / DATA</text>
    <text x="22" y="88" fill="#effff5" font-size="29" font-weight="900">PERSISTENCE</text>
    <text x="22" y="120" fill="#80c39f" font-size="19">Storage + modeling</text>
    <g fill="#a7d4b9" font-size="19"><text x="22" y="166">MySQL / SQL</text><text x="22" y="204">Relational models</text><text x="22" y="242">Local + API data</text></g>
    <circle cx="264" cy="42" r="6" fill="#6dffae"><animate attributeName="r" values="4;8;4" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(1300 535)">
    <rect width="294" height="287" rx="18" fill="#08261a" fill-opacity=".88" stroke="#227c51" stroke-width="1.5"/>
    <rect width="294" height="6" rx="3" fill="#43f493"/>
    <text x="22" y="42" fill="#61f7a1" font-family="ui-monospace,monospace" font-size="17" font-weight="800">05 / DELIVERY</text>
    <text x="22" y="88" fill="#effff5" font-size="29" font-weight="900">SHIP + ITERATE</text>
    <text x="22" y="120" fill="#80c39f" font-size="19">Validate + release</text>
    <g fill="#a7d4b9" font-size="19"><text x="22" y="166">Git / GitHub</text><text x="22" y="204">Testing / CI</text><text x="22" y="242">Packaging / deploy</text></g>
    <circle cx="264" cy="42" r="6" fill="#6dffae"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>
</g>

<g fill="#55f79d" opacity=".72">
  <circle cx="190" cy="862" r="4"><animate attributeName="cx" values="190;1475;190" dur="10s" repeatCount="indefinite"/></circle>
</g>
<text x="832" y="875" text-anchor="middle" fill="#3aaa72" font-family="ui-monospace,monospace" font-size="18" font-weight="800" letter-spacing="4">EXPERIENCE → LOGIC → INTELLIGENCE → DATA → DELIVERY</text>
</svg>