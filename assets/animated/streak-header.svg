<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="300" viewBox="0 0 1664 300">
<defs>
  <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
    <path d="M52 0H0V52" fill="none" stroke="#174a35" stroke-width="1.2" opacity=".3"/>
    <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="52 52" dur="18s" repeatCount="indefinite"/>
  </pattern>
  <radialGradient id="halo"><stop offset="0" stop-color="#32ff91" stop-opacity=".17"/><stop offset="1" stop-color="#03110b" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="1664" height="300" rx="22" fill="#07100e"/>
<rect x="34" y="22" width="1596" height="256" rx="24" fill="#04140d" stroke="#1b6848" stroke-width="1.5"/>
<rect x="34" y="22" width="1596" height="256" rx="24" fill="url(#grid)"/>
<rect width="1664" height="300" fill="url(#halo)"><animate attributeName="opacity" values=".45;1;.45" dur="8s" repeatCount="indefinite"/></rect>

<g stroke="#45ff99" stroke-width="2.3" opacity=".58">
  <path d="M68 76V44h38"/><path d="M1558 44h38v32"/><path d="M68 224v32h38"/><path d="M1558 256h38v-32"/>
</g>

<!-- animated streak flame -->
<g transform="translate(300 62)" fill="none" stroke="#54f69d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M74 152C28 124 26 77 56 42c7 24 23 34 29 44 4-31 22-58 49-79 1 34 31 48 39 78 9 34-8 70-35 87-26 16-49 9-64-20Z" opacity=".85"/>
  <path d="M94 151c-20-15-20-39-7-57 4 14 13 19 17 28 2-18 12-34 27-47 0 20 17 29 20 47 4 21-7 42-24 51-14 8-25 2-33-22Z"/>
  <path d="M74 152C28 124 26 77 56 42c7 24 23 34 29 44 4-31 22-58 49-79" stroke-dasharray="310" stroke-dashoffset="310">
    <animate attributeName="stroke-dashoffset" values="310;0;0;310" keyTimes="0;.3;.78;1" dur="7s" repeatCount="indefinite"/>
  </path>
</g>

<text x="910" y="116" text-anchor="middle" fill="#56f49a" font-family="Inter,system-ui,sans-serif" font-size="52" font-weight="900">CONTRIBUTION STREAK</text>
<text x="910" y="158" text-anchor="middle" fill="#72c99b" font-family="ui-monospace,monospace" font-size="19" font-weight="800" letter-spacing="5">CONSISTENCY / MOMENTUM / SHIPPING</text>

<line x1="610" y1="206" x2="1210" y2="206" stroke="#36e887" stroke-width="2.2" stroke-dasharray="9 15" opacity=".52">
  <animate attributeName="stroke-dashoffset" values="0;-144" dur="8s" repeatCount="indefinite"/>
</line>
<circle r="7" fill="#9effc7" filter="url(#blur)"><animateMotion dur="8s" repeatCount="indefinite" path="M610 206H1210"/></circle>
<text x="910" y="244" text-anchor="middle" fill="#3baa73" font-family="ui-monospace,monospace" font-size="17" font-weight="800">LIVE GITHUB STREAK SIGNAL</text>
</svg>