<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="760" viewBox="0 0 1664 760">
<defs>
  <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
    <path d="M52 0H0V52" fill="none" stroke="#174b37" stroke-width="1.2" opacity=".34"/>
    <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="52 52" dur="19s" repeatCount="indefinite"/>
  </pattern>
  <radialGradient id="halo" cx="50%" cy="42%" r="58%">
    <stop offset="0" stop-color="#34ff92" stop-opacity=".2"/>
    <stop offset=".55" stop-color="#0b6842" stop-opacity=".08"/>
    <stop offset="1" stop-color="#03110b" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="wave1" x1="0" x2="1">
    <stop offset="0" stop-color="#0d6f48"/>
    <stop offset=".48" stop-color="#39f18d"/>
    <stop offset="1" stop-color="#0b4d34"/>
  </linearGradient>
  <linearGradient id="wave2" x1="0" x2="1">
    <stop offset="0" stop-color="#0a3726"/>
    <stop offset=".52" stop-color="#20b56d"/>
    <stop offset="1" stop-color="#071f17"/>
  </linearGradient>
  <linearGradient id="scan" x1="0" x2="0" y1="0" y2="1">
    <stop stop-color="#50ff9e" stop-opacity="0"/>
    <stop offset=".5" stop-color="#50ff9e" stop-opacity=".18"/>
    <stop offset="1" stop-color="#50ff9e" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="title" x1="0" x2="1">
    <stop offset="0" stop-color="#4dff9c"/>
    <stop offset=".5" stop-color="#f3fff7"/>
    <stop offset="1" stop-color="#64e8a3"/>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="5"/></filter>
</defs>

<rect width="1664" height="760" rx="22" fill="#07100e"/>
<rect x="34" y="28" width="1596" height="704" rx="24" fill="#04140d" stroke="#1b6848" stroke-width="1.5"/>
<rect x="34" y="28" width="1596" height="704" rx="24" fill="url(#grid)"/>
<rect x="34" y="28" width="1596" height="704" rx="24" fill="url(#halo)">
  <animate attributeName="opacity" values=".52;1;.62;1;.52" dur="10s" repeatCount="indefinite"/>
</rect>

<!-- old README wave idea, rebuilt in HUD green -->
<g opacity=".42">
  <path d="M-120 80C130 16 280 150 520 90S880 8 1110 88s390 94 674 2V0H-120Z" fill="url(#wave2)">
    <animateTransform attributeName="transform" type="translate" values="0 0;90 10;0 0" dur="11s" repeatCount="indefinite"/>
  </path>
  <path d="M-120 112C160 30 320 170 590 108S945 35 1160 114s385 82 624 8V0H-120Z" fill="url(#wave1)" opacity=".52">
    <animateTransform attributeName="transform" type="translate" values="0 0;-110 8;0 0" dur="14s" repeatCount="indefinite"/>
  </path>
</g>

<!-- scan + moving background -->
<rect x="36" y="-110" width="1592" height="170" fill="url(#scan)">
  <animate attributeName="y" values="-110;670;-110" dur="12s" repeatCount="indefinite"/>
</rect>

<g stroke="#47ff9b" stroke-width="2.3" opacity=".58">
  <path d="M68 92V50h44"/><path d="M1552 50h44v42"/>
  <path d="M68 668v42h44"/><path d="M1552 710h44v-42"/>
</g>

<!-- ambient particles -->
<g fill="#69ffab">
  <circle cx="190" cy="200" r="4" filter="url(#blur)"><animate attributeName="cx" values="190;250;190" dur="8s" repeatCount="indefinite"/><animate attributeName="cy" values="200;158;200" dur="7s" repeatCount="indefinite"/></circle>
  <circle cx="1435" cy="184" r="5"><animate attributeName="cy" values="184;230;184" dur="7.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="3.6s" repeatCount="indefinite"/></circle>
  <circle cx="1320" cy="585" r="4"><animate attributeName="cx" values="1320;1375;1320" dur="8.6s" repeatCount="indefinite"/></circle>
  <circle cx="338" cy="585" r="5"><animate attributeName="opacity" values=".2;1;.2" dur="4.1s" repeatCount="indefinite"/></circle>
</g>

<text x="832" y="210" text-anchor="middle" fill="#60ef9f" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" font-weight="800" letter-spacing="7">NICOLAS SAVVIDES // ENGINEERING PROFILE</text>
<text x="832" y="322" text-anchor="middle" fill="url(#title)" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="94" font-weight="900" letter-spacing="1">MAKEITEZZZ555</text>

<!-- typing-style terminal from old README -->
<rect x="342" y="374" width="980" height="86" rx="18" fill="#061b12" fill-opacity=".9" stroke="#237b50" stroke-width="1.5"/>
<circle cx="376" cy="402" r="6" fill="#4df394"/><circle cx="398" cy="402" r="6" fill="#2c9860"/><circle cx="420" cy="402" r="6" fill="#184b35"/>
<text x="832" y="430" text-anchor="middle" fill="#dfffee" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="25" font-weight="750">
  Building across Web • Desktop • AI • Games
  <animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;.22;.25;.47;.5;.72;.75;.97;1" dur="16s" repeatCount="indefinite"/>
</text>
<text x="832" y="430" text-anchor="middle" fill="#dfffee" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="25" font-weight="750" opacity="0">
  Turning ideas into working software
  <animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;.22;.25;.47;.5;.72;.75;.97;1" dur="16s" repeatCount="indefinite"/>
</text>
<text x="832" y="430" text-anchor="middle" fill="#dfffee" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="25" font-weight="750" opacity="0">
  Full-stack + systems + creative engineering
  <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;.22;.25;.47;.5;.72;.75;.97;1" dur="16s" repeatCount="indefinite"/>
</text>
<text x="832" y="430" text-anchor="middle" fill="#dfffee" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="25" font-weight="750" opacity="0">
  Always building. Always learning.
  <animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" keyTimes="0;.22;.25;.47;.5;.72;.75;.97;1" dur="16s" repeatCount="indefinite"/>
</text>
<rect x="1260" y="410" width="3" height="27" fill="#69ffab"><animate attributeName="opacity" values="1;0;1" dur=".8s" repeatCount="indefinite"/></rect>

<text x="832" y="520" text-anchor="middle" fill="#f1fff6" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="32" font-weight="800">Computer Science • Full-Stack • AI/ML • Native • Systems • Creative Computing</text>

<!-- domain strip -->
<g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" font-weight="800" text-anchor="middle">
  <g><rect x="240" y="566" width="220" height="62" rx="14" fill="#08271a" stroke="#268957"/><text x="350" y="604" fill="#84ffb9">WEB SYSTEMS</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="5s" repeatCount="indefinite"/></g>
  <g><rect x="482" y="566" width="220" height="62" rx="14" fill="#08271a" stroke="#268957"/><text x="592" y="604" fill="#84ffb9">AI / ML</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="5.5s" begin=".4s" repeatCount="indefinite"/></g>
  <g><rect x="724" y="566" width="220" height="62" rx="14" fill="#08271a" stroke="#268957"/><text x="834" y="604" fill="#84ffb9">NATIVE APPS</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="6s" begin=".8s" repeatCount="indefinite"/></g>
  <g><rect x="966" y="566" width="220" height="62" rx="14" fill="#08271a" stroke="#268957"/><text x="1076" y="604" fill="#84ffb9">SYSTEMS</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="5.7s" begin="1.2s" repeatCount="indefinite"/></g>
  <g><rect x="1208" y="566" width="220" height="62" rx="14" fill="#08271a" stroke="#268957"/><text x="1318" y="604" fill="#84ffb9">CREATIVE CODE</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="6.2s" begin="1.6s" repeatCount="indefinite"/></g>
</g>

<!-- animated lower wave -->
<g opacity=".5">
  <path d="M-80 706C210 640 360 734 610 686S1035 648 1250 696s352 46 494 4V760H-80Z" fill="url(#wave2)">
    <animateTransform attributeName="transform" type="translate" values="0 0;85 -5;0 0" dur="12s" repeatCount="indefinite"/>
  </path>
  <path d="M-80 724C180 676 410 750 660 706s500-46 724 4 290 26 360 18V760H-80Z" fill="url(#wave1)" opacity=".36">
    <animateTransform attributeName="transform" type="translate" values="0 0;-95 4;0 0" dur="15s" repeatCount="indefinite"/>
  </path>
</g>
</svg>