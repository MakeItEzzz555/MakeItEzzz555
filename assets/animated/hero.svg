<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="936" viewBox="0 0 1664 936">
<defs>
  <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse" patternTransform="translate(0 0)">
    <path d="M52 0H0V52" fill="none" stroke="#184b37" stroke-width="1.3" opacity=".36"/>
    <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="52 52" dur="18s" repeatCount="indefinite"/>
  </pattern>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#42ff98" stop-opacity="0"/>
    <stop offset=".5" stop-color="#42ff98" stop-opacity=".22"/>
    <stop offset="1" stop-color="#42ff98" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="core" cx="50%" cy="45%" r="55%">
    <stop offset="0" stop-color="#2cff8e" stop-opacity=".20"/>
    <stop offset=".48" stop-color="#0c6b44" stop-opacity=".08"/>
    <stop offset="1" stop-color="#03110b" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="title" x1="0" x2="1">
    <stop offset="0" stop-color="#4dff9c"/><stop offset=".48" stop-color="#f1fff6"/><stop offset="1" stop-color="#67e9a4"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="glow2"><feGaussianBlur stdDeviation="2.8"/></filter>
</defs>

<rect width="1664" height="936" rx="22" fill="#07100e"/>
<rect x="34" y="28" width="1596" height="880" rx="24" fill="#04140d" stroke="#1d6848" stroke-width="1.6"/>
<rect x="34" y="28" width="1596" height="880" rx="24" fill="url(#grid)"/>
<rect x="34" y="28" width="1596" height="880" rx="24" fill="url(#core)">
  <animate attributeName="opacity" values=".52;1;.64;1;.52" dur="10s" repeatCount="indefinite"/>
</rect>

<!-- moving background scan -->
<rect x="36" y="-120" width="1592" height="190" fill="url(#scan)" opacity=".8">
  <animate attributeName="y" values="-120;866;-120" dur="12s" repeatCount="indefinite"/>
</rect>

<!-- decorative frame -->
<g stroke="#4aff9b" stroke-width="2.5" opacity=".6">
  <path d="M68 92V50h44"/><path d="M1552 50h44v42"/><path d="M68 844v42h44"/><path d="M1552 886h44v-42"/>
</g>

<!-- ambient particles -->
<g fill="#69ffab">
  <circle cx="178" cy="168" r="4" filter="url(#glow2)"><animate attributeName="cx" values="178;248;178" dur="8s" repeatCount="indefinite"/><animate attributeName="cy" values="168;126;168" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="3.4s" repeatCount="indefinite"/></circle>
  <circle cx="1432" cy="182" r="5" filter="url(#glow2)"><animate attributeName="cx" values="1432;1374;1432" dur="7s" repeatCount="indefinite"/><animate attributeName="cy" values="182;238;182" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values=".3;1;.3" dur="4.1s" repeatCount="indefinite"/></circle>
  <circle cx="1328" cy="714" r="4"><animate attributeName="cy" values="714;650;714" dur="7.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".18;.95;.18" dur="3.8s" repeatCount="indefinite"/></circle>
  <circle cx="304" cy="730" r="5"><animate attributeName="cx" values="304;382;304" dur="8.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="4.6s" repeatCount="indefinite"/></circle>
  <circle cx="1130" cy="250" r="3"><animate attributeName="cx" values="1130;1188;1130" dur="5.8s" repeatCount="indefinite"/></circle>
</g>

<!-- animated topology -->
<g fill="none" stroke="#34dc82" opacity=".34">
  <path d="M130 690C300 595 445 665 590 560S844 470 986 530 1215 668 1518 470" stroke-width="2.2" stroke-dasharray="12 15">
    <animate attributeName="stroke-dashoffset" values="0;-108" dur="8s" repeatCount="indefinite"/>
  </path>
  <path d="M190 250C355 315 466 245 602 286S870 365 1040 286 1320 190 1500 256" stroke-width="1.6" stroke-dasharray="7 18">
    <animate attributeName="stroke-dashoffset" values="0;100" dur="11s" repeatCount="indefinite"/>
  </path>
</g>
<g fill="#7dffb4">
  <circle r="7"><animateMotion dur="8s" repeatCount="indefinite" path="M130 690C300 595 445 665 590 560S844 470 986 530 1215 668 1518 470"/></circle>
  <circle r="5"><animateMotion dur="11s" repeatCount="indefinite" path="M190 250C355 315 466 245 602 286S870 365 1040 286 1320 190 1500 256"/></circle>
</g>

<text x="832" y="220" text-anchor="middle" fill="#59efa0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="800" letter-spacing="8">ENGINEERING PROFILE // ONLINE</text>
<text x="832" y="348" text-anchor="middle" fill="url(#title)" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="92" font-weight="900" letter-spacing="1">NICOLAS SAVVIDES</text>
<text x="832" y="414" text-anchor="middle" fill="#bff7d5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="30" font-weight="800" letter-spacing="5">MAKEITEZZZ555</text>

<g opacity=".9">
  <line x1="468" y1="464" x2="1196" y2="464" stroke="#249b60" stroke-width="2"/>
  <circle cx="468" cy="464" r="6" fill="#62ffac"/>
  <circle cx="1196" cy="464" r="6" fill="#62ffac"/>
  <rect x="600" y="458" width="464" height="12" rx="6" fill="#103d29"/>
  <rect x="600" y="458" width="128" height="12" rx="6" fill="#48ff9a" filter="url(#glow2)">
    <animate attributeName="x" values="600;936;600" dur="4.8s" repeatCount="indefinite"/>
  </rect>
</g>

<text x="832" y="542" text-anchor="middle" fill="#f2fff7" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="35" font-weight="800">Computer Science • Full-Stack • AI/ML • Native • Systems</text>
<text x="832" y="592" text-anchor="middle" fill="#91cfae" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="25" font-weight="550">Building useful software across products, intelligent systems, desktop tooling and creative computing.</text>

<g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="800" text-anchor="middle">
  <g><rect x="228" y="658" width="220" height="70" rx="15" fill="#08271a" stroke="#268957" stroke-width="1.5"/><text x="338" y="701" fill="#85ffba">WEB SYSTEMS</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="5s" repeatCount="indefinite"/></g>
  <g><rect x="476" y="658" width="220" height="70" rx="15" fill="#08271a" stroke="#268957" stroke-width="1.5"/><text x="586" y="701" fill="#85ffba">AI / ML</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="5.8s" begin=".4s" repeatCount="indefinite"/></g>
  <g><rect x="724" y="658" width="220" height="70" rx="15" fill="#08271a" stroke="#268957" stroke-width="1.5"/><text x="834" y="701" fill="#85ffba">NATIVE APPS</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="6s" begin=".8s" repeatCount="indefinite"/></g>
  <g><rect x="972" y="658" width="220" height="70" rx="15" fill="#08271a" stroke="#268957" stroke-width="1.5"/><text x="1082" y="701" fill="#85ffba">SYSTEMS</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="5.6s" begin="1.2s" repeatCount="indefinite"/></g>
  <g><rect x="1220" y="658" width="220" height="70" rx="15" fill="#08271a" stroke="#268957" stroke-width="1.5"/><text x="1330" y="701" fill="#85ffba">CREATIVE CODE</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="6.2s" begin="1.6s" repeatCount="indefinite"/></g>
</g>

<g opacity=".5">
  <path d="M220 792H1444" stroke="#2acb77" stroke-width="2" stroke-dasharray="8 18"><animate attributeName="stroke-dashoffset" from="0" to="-130" dur="9s" repeatCount="indefinite"/></path>
  <circle r="6" fill="#66ffab" filter="url(#glow2)"><animateMotion dur="9s" repeatCount="indefinite" path="M220 792H1444"/></circle>
</g>
<text x="832" y="856" text-anchor="middle" fill="#3eb87a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" font-weight="800" letter-spacing="5">BUILD • TEST • SHIP • LEARN • ITERATE</text>
</svg>