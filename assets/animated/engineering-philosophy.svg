<g font-family="Inter,system-ui,sans-serif" text-anchor="middle">
<g transform="translate(110 610)"><rect width="270" height="220" rx="18" fill="#08251a" fill-opacity=".8" stroke="#1e754b"/><text x="28" y="46" text-anchor="start" fill="#baffd2" font-family="ui-monospace,monospace" font-size="24" font-weight="900">01</text><line x1="28" y1="62" x2="242" y2="62" stroke="#1e754b"/><text x="135" y="104" fill="#effff5" font-size="20" font-weight="900">BUILD TO LEARN</text><text x="135" y="144" fill="#9cc9ae" font-size="14">Understanding grows</text><text x="135" y="166" fill="#9cc9ae" font-size="14">through implementation.</text><circle cx="235" cy="40" r="8" fill="#55ffa0" filter="url(#b)"/></g>
<g transform="translate(404 610)"><rect width="270" height="220" rx="18" fill="#08251a" fill-opacity=".8" stroke="#1e754b"/><text x="28" y="46" text-anchor="start" fill="#baffd2" font-family="ui-monospace,monospace" font-size="24" font-weight="900">02</text><line x1="28" y1="62" x2="242" y2="62" stroke="#1e754b"/><text x="135" y="104" fill="#effff5" font-size="20" font-weight="900">THINK IN SYSTEMS</text><text x="135" y="144" fill="#9cc9ae" font-size="14">Trace behavior across</text><text x="135" y="166" fill="#9cc9ae" font-size="14">the whole stack.</text><circle cx="235" cy="40" r="8" fill="#55ffa0"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle></g>
<g transform="translate(698 610)"><rect width="270" height="220" rx="18" fill="#08251a" fill-opacity=".8" stroke="#1e754b"/><text x="28" y="46" text-anchor="start" fill="#baffd2" font-family="ui-monospace,monospace" font-size="24" font-weight="900">03</text><line x1="28" y1="62" x2="242" y2="62" stroke="#1e754b"/><text x="135" y="104" fill="#effff5" font-size="20" font-weight="900">VERIFY CHANGES</text><text x="135" y="144" fill="#9cc9ae" font-size="14">Tests and evidence beat</text><text x="135" y="166" fill="#9cc9ae" font-size="14">assumptions.</text><circle cx="235" cy="40" r="8" fill="#55ffa0"><animate attributeName="r" values="5;9;5" dur="2.8s" repeatCount="indefinite"/></circle></g>
<g transform="translate(992 610)"><rect width="270" height="220" rx="18" fill="#08251a" fill-opacity=".8" stroke="#1e754b"/><text x="28" y="46" text-anchor="start" fill="#baffd2" font-family="ui-monospace,monospace" font-size="24" font-weight="900">04</text><line x1="28" y1="62" x2="242" y2="62" stroke="#1e754b"/><text x="135" y="104" fill="#effff5" font-size="20" font-weight="900">SHIP USEFUL WORK</text><text x="135" y="144" fill="#9cc9ae" font-size="14">Turn ideas into things</text><text x="135" y="166" fill="#9cc9ae" font-size="14">people can actually use.</text><circle cx="235" cy="40" r="8" fill="#55ffa0"><animate attributeName="opacity" values=".2;1;.2" dur="2.1s" repeatCount="indefinite"/></circle></g>
<g transform="translate(1286 610)"><rect width="270" height="220" rx="18" fill="#08251a" fill-opacity=".8" stroke="#1e754b"/><text x="28" y="46" text-anchor="start" fill="#baffd2" font-family="ui-monospace,monospace" font-size="24" font-weight="900">05</text><line x1="28" y1="62" x2="242" y2="62" stroke="#1e754b"/><text x="135" y="104" fill="#effff5" font-size="20" font-weight="900">ITERATE HARD</text><text x="135" y="144" fill="#9cc9ae" font-size="14">Break it, understand it,</text><text x="135" y="166" fill="#9cc9ae" font-size="14">make the next version better.</text><circle cx="235" cy="40" r="8" fill="#55ffa0"><animate attributeName="r" values="5;9;5" dur="3.1s" repeatCount="indefinite"/></circle></g>
