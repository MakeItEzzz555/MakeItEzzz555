<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="936" viewBox="0 0 1664 936">
<defs>
  <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M52 0H0V52" fill="none" stroke="#174a35" stroke-width="1.2" opacity=".34"/><animateTransform attributeName="patternTransform" type="translate" from="0 0" to="52 -52" dur="22s" repeatCount="indefinite"/></pattern>
  <radialGradient id="halo"><stop offset="0" stop-color="#32ff91" stop-opacity=".15"/><stop offset="1" stop-color="#03110b" stop-opacity="0"/></radialGradient>
  <linearGradient id="scan" x1="0" x2="0"><stop stop-color="#4cff9d" stop-opacity="0"/><stop offset=".5" stop-color="#4cff9d" stop-opacity=".16"/><stop offset="1" stop-color="#4cff9d" stop-opacity="0"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<rect width="1664" height="936" rx="22" fill="#07100e"/><rect x="34" y="28" width="1596" height="880" rx="24" fill="#04140d" stroke="#1b6848" stroke-width="1.5"/><rect x="34" y="28" width="1596" height="880" rx="24" fill="url(#grid)"/><rect width="1664" height="936" fill="url(#halo)"><animate attributeName="opacity" values=".45;1;.45" dur="10s" repeatCount="indefinite"/></rect>
<rect x="36" y="-120" width="1592" height="180" fill="url(#scan)"><animate attributeName="y" values="-120;860;-120" dur="14s" repeatCount="indefinite"/></rect>

<text x="832" y="94" text-anchor="middle" fill="#56f49a" font-family="Inter,system-ui,sans-serif" font-size="54" font-weight="900">ENGINEERING PRACTICE</text>
<text x="832" y="138" text-anchor="middle" fill="#5bca91" font-family="ui-monospace,monospace" font-size="19" font-weight="800" letter-spacing="5">DESIGN / BUILD / VALIDATE / OPTIMIZE / ITERATE</text>

<line x1="140" y1="188" x2="1524" y2="188" stroke="#42e88e" stroke-width="2.2" stroke-dasharray="9 15" opacity=".52"><animate attributeName="stroke-dashoffset" values="0;-144" dur="8s" repeatCount="indefinite"/></line>
<circle r="7" fill="#9effc7" filter="url(#blur)"><animateMotion dur="8s" repeatCount="indefinite" path="M140 188H1524"/></circle>

<g font-family="Inter,system-ui,sans-serif">
  <g transform="translate(116 225)">
    <rect width="330" height="220" rx="18" fill="#08261a" fill-opacity=".9" stroke="#227f52"/>
    <text x="24" y="50" fill="#effff5" font-size="27" font-weight="900">ARCHITECTURE</text><text x="24" y="84" fill="#6fe5a4" font-size="19">Structure • boundaries • flow</text>
    <path d="M28 165L84 135l54 20 62-50 56 26 50-48" fill="none" stroke="#4bf697" stroke-width="4" stroke-linecap="round" stroke-dasharray="18 10"><animate attributeName="stroke-dashoffset" from="0" to="-112" dur="6s" repeatCount="indefinite"/></path>
  </g>
  <g transform="translate(470 225)">
    <rect width="330" height="220" rx="18" fill="#08261a" fill-opacity=".9" stroke="#227f52"/>
    <text x="24" y="50" fill="#effff5" font-size="27" font-weight="900">VALIDATION</text><text x="24" y="84" fill="#6fe5a4" font-size="19">Test • verify • recheck</text>
    <rect x="25" y="116" width="280" height="72" rx="10" fill="#061b12" stroke="#1e6f47"/>
    <path d="M44 166l44-20 42 12 44-35 46 20 58-30" fill="none" stroke="#4bf697" stroke-width="3.5" stroke-dasharray="150" stroke-dashoffset="150"><animate attributeName="stroke-dashoffset" values="150;0;0;150" keyTimes="0;.35;.75;1" dur="6s" repeatCount="indefinite"/></path>
  </g>
  <g transform="translate(824 225)">
    <rect width="330" height="220" rx="18" fill="#08261a" fill-opacity=".9" stroke="#227f52"/>
    <text x="24" y="50" fill="#effff5" font-size="27" font-weight="900">PERFORMANCE</text><text x="24" y="84" fill="#6fe5a4" font-size="19">Measure • reduce • tune</text>
    <rect x="25" y="122" width="280" height="10" rx="5" fill="#123d29"/><rect x="25" y="122" width="190" height="10" rx="5" fill="#4bf697"><animate attributeName="width" values="80;260;170;240;190" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="25" y="164" width="280" height="10" rx="5" fill="#123d29"/><rect x="25" y="164" width="145" height="10" rx="5" fill="#4bf697"><animate attributeName="width" values="115;225;145;205;145" dur="7s" repeatCount="indefinite"/></rect>
  </g>
  <g transform="translate(1178 225)">
    <rect width="330" height="220" rx="18" fill="#08261a" fill-opacity=".9" stroke="#227f52"/>
    <text x="24" y="50" fill="#effff5" font-size="27" font-weight="900">AUTOMATION</text><text x="24" y="84" fill="#6fe5a4" font-size="19">Repeatable • tool-driven</text>
    <circle cx="165" cy="151" r="47" fill="none" stroke="#123d29" stroke-width="11"/><path d="M165 104a47 47 0 1 1-34 79" fill="none" stroke="#4bf697" stroke-width="11" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 165 151" to="360 165 151" dur="5s" repeatCount="indefinite"/></path>
  </g>
</g>

<text x="832" y="520" text-anchor="middle" fill="#56f49a" font-family="Inter,system-ui,sans-serif" font-size="46" font-weight="900">ENGINEERING PHILOSOPHY</text>
<text x="832" y="560" text-anchor="middle" fill="#65c590" font-family="ui-monospace,monospace" font-size="18" font-weight="800" letter-spacing="4">HOW I APPROACH BUILDING SOFTWARE</text>

<g font-family="Inter,system-ui,sans-serif" text-anchor="middle">
  <g transform="translate(100 605)"><rect width="276" height="220" rx="18" fill="#08261a" fill-opacity=".88" stroke="#21764e"/><text x="26" y="46" text-anchor="start" fill="#baffd2" font-family="ui-monospace,monospace" font-size="24" font-weight="900">01</text><text x="138" y="104" fill="#effff5" font-size="21" font-weight="900">BUILD TO LEARN</text><text x="138" y="148" fill="#a7d2b8" font-size="18">Understanding grows</text><text x="138" y="177" fill="#a7d2b8" font-size="18">through implementation.</text><circle cx="244" cy="40" r="7" fill="#61ffa6"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle></g>
  <g transform="translate(397 605)"><rect width="276" height="220" rx="18" fill="#08261a" fill-opacity=".88" stroke="#21764e"/><text x="26" y="46" text-anchor="start" fill="#baffd2" font-family="ui-monospace,monospace" font-size="24" font-weight="900">02</text><text x="138" y="104" fill="#effff5" font-size="21" font-weight="900">THINK IN SYSTEMS</text><text x="138" y="148" fill="#a7d2b8" font-size="18">Trace behavior across</text><text x="138" y="177" fill="#a7d2b8" font-size="18">the whole stack.</text><circle cx="244" cy="40" r="7" fill="#61ffa6"><animate attributeName="r" values="4;9;4" dur="2.5s" repeatCount="indefinite"/></circle></g>
  <g transform="translate(694 605)"><rect width="276" height="220" rx="18" fill="#08261a" fill-opacity=".88" stroke="#21764e"/><text x="26" y="46" text-anchor="start" fill="#baffd2" font-family="ui-monospace,monospace" font-size="24" font-weight="900">03</text><text x="138" y="104" fill="#effff5" font-size="21" font-weight="900">VERIFY CHANGES</text><text x="138" y="148" fill="#a7d2b8" font-size="18">Tests and evidence beat</text><text x="138" y="177" fill="#a7d2b8" font-size="18">assumptions.</text><circle cx="244" cy="40" r="7" fill="#61ffa6"><animate attributeName="opacity" values=".2;1;.2" dur="2.7s" repeatCount="indefinite"/></circle></g>
  <g transform="translate(991 605)"><rect width="276" height="220" rx="18" fill="#08261a" fill-opacity=".88" stroke="#21764e"/><text x="26" y="46" text-anchor="start" fill="#baffd2" font-family="ui-monospace,monospace" font-size="24" font-weight="900">04</text><text x="138" y="104" fill="#effff5" font-size="21" font-weight="900">SHIP USEFUL WORK</text><text x="138" y="148" fill="#a7d2b8" font-size="18">Turn ideas into things</text><text x="138" y="177" fill="#a7d2b8" font-size="18">people can actually use.</text><circle cx="244" cy="40" r="7" fill="#61ffa6"><animate attributeName="r" values="4;9;4" dur="2.9s" repeatCount="indefinite"/></circle></g>
  <g transform="translate(1288 605)"><rect width="276" height="220" rx="18" fill="#08261a" fill-opacity=".88" stroke="#21764e"/><text x="26" y="46" text-anchor="start" fill="#baffd2" font-family="ui-monospace,monospace" font-size="24" font-weight="900">05</text><text x="138" y="104" fill="#effff5" font-size="21" font-weight="900">ITERATE HARD</text><text x="138" y="148" fill="#a7d2b8" font-size="18">Break it, understand it,</text><text x="138" y="177" fill="#a7d2b8" font-size="18">make the next version better.</text><circle cx="244" cy="40" r="7" fill="#61ffa6"><animate attributeName="opacity" values=".2;1;.2" dur="3.1s" repeatCount="indefinite"/></circle></g>
</g>

<text x="832" y="880" text-anchor="middle" fill="#3aaa72" font-family="ui-monospace,monospace" font-size="18" font-weight="800" letter-spacing="4">BUILD → TEST → SHIP → LEARN → REPEAT</text>
</svg>