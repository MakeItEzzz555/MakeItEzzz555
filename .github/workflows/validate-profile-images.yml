name: Validate profile images
on:
  push:
    paths:
      - "README.md"
      - "assets/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate-profile-images.yml"
  pull_request:
    paths:
      - "README.md"
      - "assets/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate-profile-images.yml"

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check generated animated brand icons
        run: python3 scripts/build_animated_icons.py --check
      - name: Check generated signal panels
        run: python3 scripts/build_signal_panels.py --check
      - name: Test reduced-motion markup and original logo geometry
        run: python3 -m unittest discover -s tests -v
      - name: Validate README assets and local SVG files
        run: python3 scripts/validate_readme_images.py
