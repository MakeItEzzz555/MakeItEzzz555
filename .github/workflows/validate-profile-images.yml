name: Validate profile images
on:
  push:
    paths:
      - "README.md"
      - "assets/**"
      - "scripts/validate_readme_images.py"
      - ".github/workflows/validate-profile-images.yml"
  pull_request:
    paths:
      - "README.md"
      - "assets/**"
      - "scripts/validate_readme_images.py"
      - ".github/workflows/validate-profile-images.yml"

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate README assets and local SVG files
        run: python3 scripts/validate_readme_images.py
