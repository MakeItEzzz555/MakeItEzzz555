name: Refresh profile telemetry

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches:
      - main
      - feature/animated-profile-overhaul
    paths:
      - "scripts/update_profile_stats.py"
      - ".github/workflows/update-profile-stats.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate live contribution panel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: MakeItEzzz555
        run: python scripts/update_profile_stats.py

      - name: Commit refreshed telemetry
        run: |
          if git diff --quiet -- assets/animated/contribution-activity.svg; then
            echo "Profile telemetry is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/animated/contribution-activity.svg
          git commit -m "chore(profile): refresh contribution telemetry"
          git push
