name: Refresh profile telemetry

on:
  workflow_dispatch:
  schedule:
    # Best-effort GitHub Actions scheduling: refresh up to four times a day.
    # Workflow dispatch also allows an immediate on-demand refresh.
    - cron: "19 1,7,13,19 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/update_profile_stats.py"
      - ".github/workflows/update-profile-stats.yml"

permissions:
  contents: write

# A scheduled refresh and a manual dispatch must not publish over one another.
concurrency:
  group: profile-telemetry-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate live contribution panel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: MakeItEzzz555
        run: python scripts/update_profile_stats.py

      - name: Validate refreshed telemetry
        run: |
          python3 scripts/build_telemetry_panels.py --check
          python3 scripts/validate_readme_images.py
          python3 -m unittest discover -s tests -v

      - name: Commit refreshed telemetry
        run: |
          if git diff --quiet -- assets/telemetry; then
            echo "Profile telemetry is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/telemetry
          git commit -m "chore(profile): refresh contribution telemetry"
          # Main may advance while GitHub's scheduled job is running.
          # Rebase only this isolated telemetry commit; never force-push.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase origin main || exit 1
            sleep "$((attempt * 3))"
          done
          echo "Could not safely push refreshed telemetry" >&2
          exit 1
